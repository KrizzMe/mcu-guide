<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel - Cinematic Experience Fan Guide</title>
	<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
	<link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(30, 30, 30, 0.85);
            --accent-color: #890000;
            --text-color: #e0e0e0;
            --text-muted: #b0b0b0;
            --border-color: #333333;
        }

        /* Sanftes Scrollen für Anker */
        html {
            scroll-behavior: smooth;
        }

        /* Stilische Scrollbar für Webkit-Browser */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(18, 18, 18, 0.9);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
            border: 2px solid var(--bg-color);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* Für Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) var(--bg-color);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.92)), 
                        url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 60px; 
        }

        /* Fixierte Kopfzeile oben für den Titel */
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            padding: 8px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* Hamburger-Button: nur auf Mobile sichtbar (siehe Media Query),
           liegt links im Header über dem Titel */
        .nav-toggle {
            display: none;
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
            z-index: 1010;
        }

        .nav-toggle span {
            display: block;
            width: 20px;
            height: 2px;
            margin: 4px auto;
            background-color: var(--text-color);
            border-radius: 2px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .nav-toggle.open span:nth-child(1) {
            transform: translateY(6px) rotate(45deg);
        }
        .nav-toggle.open span:nth-child(2) {
            opacity: 0;
        }
        .nav-toggle.open span:nth-child(3) {
            transform: translateY(-6px) rotate(-45deg);
        }

        /* H1 als kompakter Titel in der Top-Bar */
		.header-bar h1 {
            font-family: 'Bangers', cursive, sans-serif;
            text-align: center;
            color: #ffffff;
            /* Skaliert automatisch, bricht nicht um und bleibt in einer Zeile */
            font-size: clamp(1rem, 3vw, 4rem); 
            white-space: nowrap;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: none;
            padding-bottom: 0;
            text-shadow: 3px 3px 0px #e50914, 5px 5px 10px rgba(0,0,0,0.9);
        }

        /* Standard-Navigation (Desktop) */
        .quick-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .quick-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.05);
            transition: all 0.2s ease;
        }

        .quick-nav a:hover {
            color: #ffffff;
            background-color: var(--accent-color);
        }

        /* Icon grau statt bunt - gleicher Look wie eine nicht bewertete
           (inaktive) Popcorn-Tüte, siehe .popcorn weiter unten */
        .nav-home-icon {
            filter: grayscale(1) opacity(0.35);
        }

        /* Schließen-Button (X) ist nur für das mobile Drawer-Menü gedacht -
           auf Desktop komplett ausgeblendet (siehe Media Query fürs Mobile-Styling) */
        .nav-close {
            display: none;
        }

        /* Standard Abstandhalter für Desktop.
           padding-bottom reserviert Platz für den fixierten Footer unten -
           ohne das würde die letzte Filmkarte teilweise dahinter
           verschwinden (Bug #15). Footer ist ca. 37px hoch (Text + Padding
           + Border), 60px lässt komfortablen Sicherheitsabstand. */
        .content-wrapper {
            margin-top: 150px;
            padding-bottom: 60px;
        }

        h2 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-top: 10px;
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-color);
            padding-left: 15px;
            scroll-margin-top: 180px;
			-webkit-text-stroke: 0.5px var(--border-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .movie-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
            align-items: stretch;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .movie-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .movie-poster {
            flex-shrink: 0;
            align-self: center;
            width: 80px;
            height: 120px;
            background-color: #2a2a2a;
            border-radius: 4px;
            border: 1px dashed #555;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            overflow: hidden;
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .movie-title-row {
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .movie-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            min-width: 0;
        }

        .movie-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Gemeinsame untere Zeile der Karte: links Laufzeit + IMDb/TMDb-Icons,
           rechts die Popcorn-Bewertung. margin-top: auto sorgt dafür, dass die
           Zeile immer unten in der Karte sitzt (siehe .movie-content: flex column). */
        .movie-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: auto;
            padding-top: 10px;
        }

        .movie-meta-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .movie-runtime {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            gap: 4px;
            font-size: 0.85rem;
            font-weight: normal;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .runtime-icon {
            font-size: 0.95em;
        }

        .meta-icon {
            height: 18px;
            width: auto;
            display: block;
            opacity: 0.8;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .meta-icon:hover {
            opacity: 1;
            transform: scale(1.12);
        }

        /* Bewertung: Popcorn-Tüten statt Sterne */
        .movie-rating {
            display: flex;
            gap: 6px;
        }

        .popcorn {
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
            user-select: none;
            filter: grayscale(1) opacity(0.35);
            transition: filter 0.15s ease, transform 0.1s ease;
        }

        .popcorn.filled {
            filter: none;
        }

        .popcorn:hover {
            transform: scale(1.2);
        }

        /* Overlay / Lightbox Styling */
        #poster-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding-top: 160px;
            padding-bottom: 80px;
            cursor: pointer;
        }

        #poster-overlay img {
            max-width: 90%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.7);
            object-fit: contain;
        }

        /* Fixierter Footer unten */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(8px);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            padding: 10px 0;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.7);
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        /* --- Ausklappbare, vertikale Navigation links für Tablets & Smartphones --- */
        @media screen and (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                max-width: 100%;
                padding: 5px;
            }

            /* H1 bleibt oben, wird aber kompakter */
            .header-bar {
                padding: 6px 10px;
                gap: 2px;
            }

            .header-bar h1 {
                font-size: clamp(0.8rem, 3.8vw, 1.5rem); 
                white-space: nowrap;
                text-shadow: 2px 2px 0px #e50914, 3px 3px 6px rgba(0,0,0,0.9);
            }

            /* Verstecke die normale Navigation im Header auf Mobile */
            .header-bar .quick-nav {
                display: none;
            }

            /* Hamburger-Button auf Mobile einblenden */
            .nav-toggle {
                display: block;
            }

            /* Halbtransparenter Hintergrund hinter dem Drawer.
               Deckt IMMER den kompletten Bildschirm ab (0 bis 100vh),
               dadurch kein Überlappen/Reinragen in Header oder Footer mehr,
               egal wie hoch diese je nach Gerät gerade sind. */
            .nav-backdrop {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                /* WICHTIG: niedriger als der z-index von .header-bar (1000)!
                   Das Menü liegt im HTML verschachtelt innerhalb von
                   .header-bar, welches durch position:fixed + z-index einen
                   eigenen Stacking-Context bildet. Der z-index des Menüs
                   (weiter unten, 1500) wirkt deshalb NUR innerhalb dieses
                   Headers, nicht gegenüber diesem Backdrop hier. Wäre dieser
                   Wert höher als 1000, würde er den kompletten Header samt
                   Menü optisch überdecken und dessen Klicks abfangen -
                   sichtbar bliebe alles (halbtransparent), klickbar aber nicht. */
                z-index: 900;
            }

            .nav-backdrop.open {
                display: block;
            }

            /* Vollflächiges Drawer-Panel links, klar vom Content abgesetzt
               durch einen durchgehenden, blickdichten Hintergrund
               (kein durchscheinender roter Rand mehr) */
            .quick-nav.mobile-sidebar {
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 0;
                left: 0;
                width: min(58vw, 220px);
                height: 100vh;
                height: 100dvh;
                background-color: #161616;
                border-right: 1px solid var(--border-color);
                box-shadow: 4px 0 24px rgba(0,0,0,0.6);
                z-index: 1500;
                padding: 64px 12px 20px;
                gap: 6px;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                overflow-y: auto;
                box-sizing: border-box;
                align-items: stretch;
            }

            /* Wenn die Klasse 'open' aktiv ist, fährt das Panel ein */
            .quick-nav.mobile-sidebar.open {
                transform: translateX(0);
            }

            /* Schließen-Button oben im Drawer - nur hier sichtbar */
            .nav-close {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                top: 16px;
                right: 16px;
                width: 34px;
                height: 34px;
                background: rgba(255,255,255,0.05);
                border: 1px solid var(--border-color);
                border-radius: 6px;
                color: var(--text-color);
                font-size: 1.1rem;
                line-height: 1;
                cursor: pointer;
            }

            /* Normale, waagerechte Links im Drawer statt gedrehtem Text */
            .quick-nav.mobile-sidebar a {
                writing-mode: horizontal-tb;
                transform: none;
                font-size: 0.82rem;
                padding: 10px 12px;
                text-align: left;
                white-space: normal;
                background-color: rgba(255,255,255,0.03);
                border-radius: 6px;
                color: var(--text-muted);
                text-decoration: none;
                border: 1px solid var(--border-color);
                touch-action: manipulation;
                -webkit-tap-highlight-color: rgba(255,255,255,0.15);
            }

            .quick-nav.mobile-sidebar {
                touch-action: pan-y;
            }

            .quick-nav.mobile-sidebar a:active,
            .quick-nav.mobile-sidebar a:hover {
                color: #ffffff;
                background-color: var(--accent-color);
            }

            /* Abstandhalter oben dynamisch an die kleinere Header-Größe angepasst.
               padding-bottom analog zu Desktop, an kleineren Mobile-Footer
               angepasst (Bug #15) */
            .content-wrapper {
                margin-top: clamp(60px, 12vw, 85px);
                padding-bottom: 50px;
            }

            h2 {
                font-size: 1.3rem;
                /* Dynamischer Anker-Abstand, damit H2 perfekt unter dem Header sitzt */
                scroll-margin-top: clamp(65px, 14vw, 90px);
            }

            /* --- Poster-Bleed-Effekt (nur Mobile): Poster liegt als
               durchgehender Hintergrund HINTER der kompletten Karte (nicht
               mehr als eigene seitliche Box), object-position:top verhindert
               dass Köpfe/Gesichter beim Zuschneiden verloren gehen (Poster
               werden praktisch immer von UNTEN statt mittig beschnitten).
               Fade-Zone in festen Pixeln (nicht Prozent), damit sie bei
               unterschiedlich langen Beschreibungen (= unterschiedlich hohen
               Karten) immer an derselben Stelle sitzt statt mitzuwandern.
               Text-Schatten als zusätzliche Sicherheit für Lesbarkeit,
               unabhängig davon wie hell/unruhig ein Poster-Motiv ist. */
            .movie-card {
                position: relative;
                overflow: hidden;
                padding: 0;
                gap: 0;
            }

            .movie-poster {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: none;
                border-radius: 0;
            }

            .movie-poster::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(to bottom,
                    rgba(18, 18, 18, 0) 0px,
                    rgba(18, 18, 18, 0) 120px,
                    var(--card-bg) 185px,
                    var(--card-bg) 100%);
            }

            .movie-poster img {
                object-position: top;
            }

            .movie-content {
                position: relative;
                z-index: 1;
                margin-left: 0;
                padding: 195px 14px 14px;
            }

            .movie-title,
            .movie-desc,
            .movie-runtime {
                text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
            }

            .movie-title {
                font-size: 1rem;
            }

            .movie-desc {
                font-size: 0.8rem;
            }

            .popcorn {
                font-size: 1.1rem;
            }

            .movie-runtime {
                font-size: 0.75rem;
            }

            .meta-icon {
                height: 15px;
            }

            .movie-meta-row {
                gap: 6px;
            }

            .movie-meta-left {
                gap: 14px;
            }

            footer {
                font-size: 0.7rem;
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>
    <div id="top"></div>

    <!-- Fixierte Kopfzeile oben -->
    <header class="header-bar">
        <button class="nav-toggle" id="navToggle" onclick="toggleSidebar()" aria-label="Menü öffnen">
            <span></span><span></span><span></span>
        </button>
        <h1>Marvel - Cinematic Experience Fan Guide</h1>
        <nav class="quick-nav mobile-sidebar" id="mobileNav"></nav>
    </header>
    <div class="nav-backdrop" id="navBackdrop" onclick="toggleSidebar()"></div>

    <div class="container content-wrapper">
    </div>

    <!-- Fixierter Footer unten -->
    <footer>
        <p>(c) Marvel - Cinematic Experience  Fan Guide by .Kriz - 2026</p>
    </footer>

    <!-- Overlay-Container -->
    <div id="poster-overlay" onclick="closeOverlay()">
        <img id="overlay-img" src="" alt="Großes Poster">
    </div>

    <script>
        // ================================================================
        // FILM-DATENBANK
        // Neue Filme hinzufügen, Reihenfolge ändern oder Sektionen anpassen:
        // Einfach hier im Array editieren - der Rest rendert sich automatisch.
        // Jede Sektion braucht: id (für Anker-Links, ohne Leerzeichen),
        // title (Überschrift im Text), navLabel (Kurzform fürs Menü)
        // und movies[] mit title, poster (Bild-URL) und desc.
        // ================================================================
        // Filmdaten werden zur Laufzeit aus moviedata.json geladen (siehe unten fetchAndRender()).
        let MOVIE_DATA = [];

        // Escaped Sonderzeichen, damit Titel/Beschreibungen nie HTML brechen
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderNav() {
            const nav = document.getElementById('mobileNav');
            const closeButton = `<button class="nav-close" aria-label="Menü schließen">✕</button>`;
            const homeLink = `<a href="#top" class="nav-home" aria-label="Zur Startseite"><span class="nav-home-icon">🏠</span> Home</a>`;
            const links = MOVIE_DATA.map((section, i) =>
                `<a href="#${section.id}" data-section-id="${section.id}">${i + 1}. ${escapeHtml(section.navLabel)}</a>`
            ).join('');
            nav.innerHTML = closeButton + homeLink + links;

            // Klick-Handler per addEventListener statt Inline-onclick binden.
            // Robuster als String-Interpolation in onclick-Attributen, da so
            // keine Sonderzeichen (Anführungszeichen o.ä.) in IDs die
            // generierten Attribute versehentlich zerstören können.
            nav.querySelector('.nav-close').addEventListener('click', toggleSidebar);
            nav.querySelector('.nav-home').addEventListener('click', goHome);
            nav.querySelectorAll('a[data-section-id]').forEach(link => {
                link.addEventListener('click', event => goToSection(event, link.dataset.sectionId));
            });
        }

        // Scrollt sanft nach ganz oben und schließt dabei das mobile Drawer-Menü
        function goHome(event) {
            event.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            closeSidebar();
        }

        // Scrollt gezielt zu einer Sektion. Wird per JS statt per nativem
        // Anker-Sprung erledigt, da der native Sprung in manchen mobilen
        // Browsern nicht zuverlässig funktioniert, wenn der Link in einem
        // Container mit CSS-"transform" liegt (unser Slide-in-Menü).
        function goToSection(event, sectionId) {
            event.preventDefault();
            const target = document.getElementById(sectionId);
            closeSidebar();
            if (target) {
                // kurze Verzögerung, damit die Schließen-Animation des Menüs
                // den Scrollvorgang nicht stört
                setTimeout(() => {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 60);
            } else {
                console.warn('Ziel-Sektion nicht gefunden:', sectionId);
            }
        }

        // --- Bewertungssystem (0-5 Popcorn-Tüten), NUR lokal im Browser gespeichert ---
        // Nutzt localStorage - die Bewertung bleibt auf diesem Gerät/Browser und
        // wird nirgendwo hochgeladen oder synchronisiert.
        function ratingKey(movieId) {
            return 'mcu-rating-' + movieId;
        }

        function getRating(movieId) {
            try {
                return parseInt(localStorage.getItem(ratingKey(movieId)) || '0', 10);
            } catch (e) {
                return 0; // z.B. privates Surfen ohne Storage-Zugriff
            }
        }

        function setRating(movieId, value, event) {
            event.stopPropagation(); // verhindert, dass die Karte das Poster-Overlay öffnet
            const current = getRating(movieId);
            const next = (current === value) ? 0 : value; // erneutes Antippen setzt zurück
            try {
                localStorage.setItem(ratingKey(movieId), String(next));
            } catch (e) {
                console.warn('Bewertung konnte nicht gespeichert werden:', e);
            }
            updateRatingDisplay(movieId);
        }

        function updateRatingDisplay(movieId) {
            const widget = document.querySelector('.movie-rating[data-movie-id="' + movieId + '"]');
            if (!widget) return;
            const current = getRating(movieId);
            widget.querySelectorAll('.popcorn').forEach(el => {
                const val = parseInt(el.dataset.value, 10);
                el.classList.toggle('filled', val <= current);
            });
        }

        function renderRatingWidget(movieId) {
            const current = getRating(movieId);
            const bags = [1, 2, 3, 4, 5].map(i => {
                const filled = i <= current ? ' filled' : '';
                return `<span class="popcorn${filled}" data-value="${i}" onclick="setRating('${movieId}', ${i}, event)" role="button" aria-label="${i} von 5 Popcorn-Tüten bewerten">🍿</span>`;
            }).join('');
            return `<div class="movie-rating" data-movie-id="${movieId}">${bags}</div>`;
        }

        function renderMovieRuntime(movie) {
            return movie.runtime
                ? `<span class="movie-runtime"><span class="runtime-icon" aria-hidden="true">🎞️</span>${escapeHtml(movie.runtime)}</span>`
                : '';
        }

        function renderMovieMeta(movie) {
            const imdbLink = movie.imdb
                ? `<a href="${escapeHtml(movie.imdb)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" aria-label="${escapeHtml(movie.title)} auf IMDb ansehen"><img class="meta-icon" src="imdb.png" alt="IMDb" loading="lazy"></a>`
                : '';
            const tmdbLink = movie.tmdb
                ? `<a href="${escapeHtml(movie.tmdb)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" aria-label="${escapeHtml(movie.title)} auf TMDb ansehen"><img class="meta-icon" src="tmdb.png" alt="TMDb" loading="lazy"></a>`
                : '';
            return `<div class="movie-meta-left">${imdbLink}${tmdbLink}</div>`;
        }

        function renderMovieCard(movie) {
            return `
        <div class="movie-card" onclick="openOverlay(this)">
            <div class="movie-poster">
                <img src="${movie.poster}" alt="${escapeHtml(movie.title)}" loading="lazy">
            </div>
            <div class="movie-content">
                <div class="movie-title-row">
                    <div class="movie-title">${escapeHtml(movie.title)}</div>
                    ${renderMovieRuntime(movie)}
                </div>
                <div class="movie-desc">${escapeHtml(movie.desc)}</div>
                <div class="movie-meta-row">
                    ${renderMovieMeta(movie)}
                    ${renderRatingWidget(movie.id)}
                </div>
            </div>
        </div>`;
        }

        function renderContent() {
            const container = document.querySelector('.container.content-wrapper');
            const html = MOVIE_DATA.map(section => `
        <h2 id="${section.id}">${escapeHtml(section.title)}</h2>
        ${section.movies.map(renderMovieCard).join('')}
            `).join('');
            container.innerHTML = html;
        }

        // Lädt moviedata.json und rendert erst danach Navigation und Filmkarten.
        // Hinweis: fetch() auf eine lokale Datei funktioniert nur über http(s) -
        // z. B. auf GitHub Pages, oder lokal über einen einfachen Webserver
        // (python3 -m http.server), NICHT per Doppelklick/file://.
        async function fetchAndRender() {
            const container = document.querySelector('.container.content-wrapper');
            try {
                const response = await fetch('moviedata.json');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                MOVIE_DATA = await response.json();
                renderNav();
                renderContent();
            } catch (err) {
                console.error('Konnte moviedata.json nicht laden:', err);
                container.innerHTML =
                    '<p style="text-align:center; padding: 40px 10px;">' +
                    'Filmdaten konnten nicht geladen werden. Läuft die Seite über ' +
                    'http(s) (z. B. GitHub Pages oder einen lokalen Webserver) und ' +
                    'liegt <code>moviedata.json</code> im selben Ordner wie diese Datei?' +
                    '</p>';
            }
        }

        fetchAndRender();
    </script>

    <script>
        function openOverlay(cardElement) {
            const imgElement = cardElement.querySelector('.movie-poster img');
            if (!imgElement) return;
            
            const overlay = document.getElementById('poster-overlay');
            const overlayImg = document.getElementById('overlay-img');
            overlayImg.src = imgElement.src;
            overlay.style.display = 'flex';
        }

        function closeOverlay() {
            const overlay = document.getElementById('poster-overlay');
            overlay.style.display = 'none';
        }

        // ESC schließt Poster-Overlay bzw. Navigations-Drawer
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeOverlay();
                closeSidebar();
            }
        });

        // Funktion zum Ein- und Ausklappen des Navigations-Drawers auf Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('mobileNav');
            const backdrop = document.getElementById('navBackdrop');
            const toggleBtn = document.getElementById('navToggle');
            const isOpen = sidebar.classList.toggle('open');
            backdrop.classList.toggle('open', isOpen);
            toggleBtn.classList.toggle('open', isOpen);
            toggleBtn.setAttribute('aria-label', isOpen ? 'Menü schließen' : 'Menü öffnen');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('mobileNav');
            if (sidebar.classList.contains('open')) {
                toggleSidebar();
            }
        }

        // Touch-Gestenerkennung für Wischfunktion (Swipe)
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const sidebar = document.getElementById('mobileNav');
            const swipeDistance = touchEndX - touchStartX;
            
            // Wenn nach rechts gewischt wird (und Wischstrecke > 70px war) -> Menü öffnen
            if (swipeDistance > 70 && !sidebar.classList.contains('open')) {
                toggleSidebar();
            }
            // Wenn nach links gewischt wird (und Wischstrecke < -70px war) -> Menü schließen
            else if (swipeDistance < -70 && sidebar.classList.contains('open')) {
                toggleSidebar();
            }
        }
    </script>

</body>
</html>
