<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <!-- Content-Security-Policy (Issue #62) - GitHub Pages erlaubt keine
         eigenen HTTP-Header, deshalb hier per meta-Tag statt als
         Response-Header. Muss so früh wie möglich im <head> stehen, da sie
         nur Ressourcen betrifft, die NACH diesem Tag angefragt werden.
         Enthält "unsafe-inline" für script-src/style-src, weil die App
         durchgehend Inline-onclick-Attribute und einzelne Inline-style-
         Attribute nutzt (siehe Issue #62, Migration auf addEventListener
         als separates, größeres Folge-Issue). Trotzdem wirksam gegen
         Fremd-Skripte/-Verbindungen von komplett anderen Domains.
         Erlaubte Quellen, je nach tatsächlicher Nutzung im Code:
         - www.gstatic.com: Firebase-SDK-Module (groups.js-Imports)
         - apis.google.com: lädt Firebase intern für signInWithPopup nach
           (gapi, für den Google-Anmelde-Popup) - beim lokalen Test ohne
           dieses Fehlen wortwörtlich als CSP-Verstoß in der Konsole
           aufgetaucht, deshalb hier bewusst mit aufgenommen
         - mcuguide.firebaseapp.com: versteckter Auth-Hilfs-iframe von
           Firebase (signInWithPopup)
         - firestore.googleapis.com / identitytoolkit.googleapis.com /
           securetoken.googleapis.com / www.googleapis.com: Firestore
           bzw. Firebase Authentication
         - api.themoviedb.org / image.tmdb.org: TMDB-Anfragen bzw. Poster
         - www.youtube-nocookie.com: eingebetteter Trailer-Player
         frame-ancestors/report-uri/sandbox fehlen bewusst - die
         CSP-Spezifikation ignoriert diese Direktiven, wenn die Policy
         (wie hier) per meta-Tag statt per HTTP-Header ausgeliefert wird. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' https://image.tmdb.org;
        font-src 'self';
        connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://api.themoviedb.org;
        frame-src https://www.youtube-nocookie.com https://mcuguide.firebaseapp.com;
        object-src 'none';
        base-uri 'self';
    ">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Guide</title>
    <meta name="description" content="Private Übersicht deiner Lieblings-Filmreihen in empfohlener Reihenfolge für gemeinsame Familien-Filmabende - mit Bewertung und geteilten Gruppen-Bewertungen.">

    <!-- Open-Graph-Tags: sorgen für eine Vorschau mit Bild, Titel und
         Beschreibung, wenn der Link z. B. in WhatsApp geteilt wird. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mymovieguide.de/">
    <meta property="og:title" content="My Movie Guide">
    <meta property="og:description" content="Private Übersicht deiner Lieblings-Filmreihen in empfohlener Reihenfolge für gemeinsame Familien-Filmabende - mit Bewertung und geteilten Gruppen-Bewertungen.">
    <meta property="og:image" content="https://mymovieguide.de/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

	<link rel="manifest" href="manifest.json">
	<link rel="icon" type="image/png" sizes="32x32" href="fav32.png">
	<link rel="apple-touch-icon" href="m.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="top"></div>

    <!-- Fixierte Kopfzeile oben -->
    <header class="header-bar">
        <button class="nav-toggle" id="navToggle" onclick="toggleSidebar()" aria-label="Menü öffnen">
            <span></span><span></span><span></span>
        </button>
        <h1>My Movie Guide</h1>
        <nav class="quick-nav mobile-sidebar" id="mobileNav"></nav>
    </header>
    <div class="nav-backdrop" id="navBackdrop" onclick="toggleSidebar()"></div>

    <div class="container content-wrapper">
    </div>

    <!-- Fixierter Footer unten -->
    <footer>
        <p>(c) My Movie Guide by KrizzMe - 2026
           <span class="footer-trenner">·</span>
           <button class="footer-link" onclick="window.openInfos && window.openInfos()">Infos zum Fan Guide</button>
           <span class="footer-trenner">·</span>
           <button class="footer-link" onclick="window.openDatenschutz && window.openDatenschutz()">Datenschutzhinweise</button>
        </p>
    </footer>

    <!-- Overlay-Container -->
    <div id="poster-overlay" onclick="closeOverlay()">
        <div class="overlay-inhalt" onclick="event.stopPropagation()">
            <button class="overlay-schliessen" onclick="closeOverlay()" aria-label="Schließen">✕</button>
            <img id="overlay-img" src="" alt="Großes Poster">
            <div id="trailer-bereich"></div>
        </div>
    </div>



    <!-- Gruppen-Fenster (Inhalt wird von groups.js aufgebaut) -->
    <div id="gruppen-fenster">
        <div class="gruppen-box" role="dialog" aria-label="Gruppenverwaltung">
            <div class="gruppen-kopf">
                <span id="gruppen-titel">Gruppen</span>
                <button class="gruppen-schliessen" data-aktion="schliessen" aria-label="Schließen">✕</button>
            </div>
            <div id="gruppen-meldung" class="gruppen-meldung"></div>
            <div id="gruppen-inhalt"></div>
        </div>
    </div>

    <!-- kernfunktionen.js zuerst: app.js nutzt dessen Funktionen/Konstanten
         als normale Globals (Issue #61) -->
    <script src="kernfunktionen.js"></script>
    <!-- ui.js vor app.js: app.js greift beim Aufbau der Navigation darauf zu -->
    <script src="ui.js"></script>
    <script src="app.js"></script>
    <!-- groups.js als Modul, da das Firebase-SDK nur so verfügbar ist -->
    <script type="module" src="groups.js"></script>
</body>
</html>
