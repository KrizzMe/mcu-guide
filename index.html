<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel - Cinematic Experience Fan Guide</title>
	<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
	<link rel="manifest" href="manifest.json">
	<link rel="icon" type="image/png" sizes="32x32" href="fav32.png">
	<link rel="apple-touch-icon" href="m.png">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(30, 30, 30, 0.85);
            --accent-color: #890000;
            --text-color: #e0e0e0;
            --text-muted: #b0b0b0;
            --border-color: #333333;
        }

        /* Sanftes Scrollen für Anker */
        html {
            scroll-behavior: smooth;
        }

        /* Stilische Scrollbar für Webkit-Browser */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(18, 18, 18, 0.9);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
            border: 2px solid var(--bg-color);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* Für Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) var(--bg-color);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.92)), 
                        url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 60px; 
        }

        /* Fixierte Kopfzeile oben für den Titel */
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            padding: 8px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* Hamburger-Button: nur auf Mobile sichtbar (siehe Media Query),
           liegt links im Header über dem Titel */
        .nav-toggle {
            display: none;
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
            z-index: 1010;
        }

        .nav-toggle span {
            display: block;
            width: 20px;
            height: 2px;
            margin: 4px auto;
            background-color: var(--text-color);
            border-radius: 2px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .nav-toggle.open span:nth-child(1) {
            transform: translateY(6px) rotate(45deg);
        }
        .nav-toggle.open span:nth-child(2) {
            opacity: 0;
        }
        .nav-toggle.open span:nth-child(3) {
            transform: translateY(-6px) rotate(-45deg);
        }

        /* H1 als kompakter Titel in der Top-Bar */
		.header-bar h1 {
            font-family: 'Bangers', cursive, sans-serif;
            text-align: center;
            color: #ffffff;
            /* Skaliert automatisch, bricht nicht um und bleibt in einer Zeile */
            font-size: clamp(1rem, 3vw, 4rem); 
            white-space: nowrap;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: none;
            padding-bottom: 0;
            text-shadow: 3px 3px 0px #e50914, 5px 5px 10px rgba(0,0,0,0.9);
        }

        /* Standard-Navigation (Desktop) */
        .quick-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .quick-nav a {
            position: relative;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid transparent;
            background-color: rgba(255,255,255,0.05);
            transition: border-color 0.2s ease, color 0.2s ease;
            overflow: hidden;
        }

        /* Hintergrund wird zur Laufzeit per JS als Fortschritts-Füllung
           gesetzt (siehe applyNavFill) - je mehr Filme in dieser Sektion
           (bzw. insgesamt beim Home-Button) als "gesehen" markiert sind,
           desto weiter füllt sich der Button grün von links nach rechts. */
        .quick-nav a:hover {
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Zähler "(n/n)" im Nav-Button - auf Desktop ausgeblendet (Pills sind
           dort bewusst kompakt), auf Mobile eingeblendet, siehe Media Query */
        .nav-progress {
            display: none;
        }

        /* Icon grau statt bunt - gleicher Look wie eine nicht bewertete
           (inaktive) Popcorn-Tüte, siehe .popcorn weiter unten */
        .nav-home-icon {
            filter: grayscale(1) opacity(0.35);
        }

        /* Schließen-Button (X) ist nur für das mobile Drawer-Menü gedacht -
           auf Desktop komplett ausgeblendet (siehe Media Query fürs Mobile-Styling) */
        .nav-close {
            display: none;
        }

        /* Standard Abstandhalter für Desktop.
           padding-bottom reserviert Platz für den fixierten Footer unten -
           ohne das würde die letzte Filmkarte teilweise dahinter
           verschwinden (Bug #15). Footer ist ca. 37px hoch (Text + Padding
           + Border), 60px lässt komfortablen Sicherheitsabstand. */
        .content-wrapper {
            margin-top: 150px;
            padding-bottom: 60px;
        }

        h2 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-top: 10px;
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-color);
            padding-left: 15px;
            scroll-margin-top: 180px;
			-webkit-text-stroke: 0.5px var(--border-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Desktop: Poster-Bleed-Effekt (Issue #14).
           aspect-ratio 50/11 koppelt die Kartenhöhe an die Poster-Breite (22%),
           sodass der sichtbare Poster-Ausschnitt quadratisch ist. Da die Poster
           im Format 2:3 vorliegen, entspricht ein quadratischer Ausschnitt mit
           object-position:top exakt den oberen 2/3 des Posters - Gesichter/Köpfe
           bleiben dadurch zuverlässig sichtbar. */
        .movie-card {
            position: relative;
            overflow: hidden;
            background-color: var(--card-bg);
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0;
            margin-bottom: 15px;
            display: flex;
            gap: 0;
            align-items: stretch;
            aspect-ratio: 50 / 11;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        /* Statischer grüner Rand, sobald der Film bewertet ("gesehen") wurde -
           analog zum roten Hover-Rand, aber dauerhaft sichtbar. Regel bewusst
           VOR :hover platziert, damit ein Hover (rot) auch bei bereits
           gesehenen Karten kurzzeitig Vorrang hat. */
        .movie-card.watched {
            border-color: #4caf50;
        }

        .movie-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .movie-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 22%;
            height: 100%;
            background-color: #2a2a2a;
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            overflow: hidden;
            -webkit-mask-image: linear-gradient(to right, black 58%, transparent 96%);
            mask-image: linear-gradient(to right, black 58%, transparent 96%);
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        /* Platzhalter, wenn ein Posterbild nicht geladen werden kann.
           Verhindert das kaputte Bild-Symbol des Browsers. */
        .movie-poster.poster-missing {
            -webkit-mask-image: none;
            mask-image: none;
            background-color: #242424;
            border-right: 1px solid var(--border-color);
        }

        .movie-poster.poster-missing::before {
            content: "🎬";
            font-size: 1.8rem;
            opacity: 0.35;
        }

        /* Rückwärts-Verlauf sorgt dafür, dass der Text auch über der
           ausfadenden Poster-Kante lesbar bleibt. Vertikal zentriert, damit
           bei kurzen Beschreibungen kein großer Leerraum unten entsteht. */
        .movie-content {
            position: relative;
            z-index: 1;
            flex-grow: 1;
            margin-left: 19%;
            padding: 18px 24px 18px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(to right,
                rgba(30, 30, 30, 0) 0%,
                var(--card-bg) 30%,
                var(--card-bg) 100%);
        }

        .movie-title-row {
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .movie-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            min-width: 0;
        }

        /* --- Fortschritts-Anzeige (Issue #3) ---
           Der frühere separate Fortschrittsbalken wurde entfernt - der
           Fortschritt wird stattdessen direkt in die Navigations-Buttons
           integriert (siehe applyNavFill im Script-Bereich). */

        /* Zähler direkt neben der Sektions-Überschrift, bewusst nicht in
           Akzentfarbe (h2 ist rot), damit er sich als Nebeninfo abhebt */
        .section-count {
            font-size: 0.9rem;
            font-weight: normal;
            color: var(--text-muted);
            margin-left: 8px;
        }

        .movie-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Gemeinsame untere Zeile der Karte: links Laufzeit + IMDb/TMDb-Icons,
           rechts die Popcorn-Bewertung. margin-top: auto sorgt dafür, dass die
           Zeile immer unten in der Karte sitzt (siehe .movie-content: flex column). */
        .movie-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: auto;
            padding-top: 10px;
        }

        .movie-meta-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .movie-runtime {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            gap: 4px;
            font-size: 0.85rem;
            font-weight: normal;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .runtime-icon {
            font-size: 0.95em;
        }

        .meta-icon {
            height: 18px;
            width: auto;
            display: block;
            opacity: 0.8;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .meta-icon:hover {
            opacity: 1;
            transform: scale(1.12);
        }

        /* Bewertung: Popcorn-Tüten statt Sterne */
        .movie-rating {
            display: flex;
            gap: 6px;
        }

        .popcorn {
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
            user-select: none;
            filter: grayscale(1) opacity(0.35);
            transition: filter 0.15s ease, transform 0.1s ease;
        }

        .popcorn.filled {
            filter: none;
        }

        .popcorn:hover {
            transform: scale(1.2);
        }

        /* Overlay / Lightbox Styling */
        #poster-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding-top: 160px;
            padding-bottom: 80px;
            cursor: pointer;
        }

        #poster-overlay img {
            max-width: 90%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.7);
            object-fit: contain;
        }

        /* Fixierter Footer unten */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(8px);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            padding: 10px 0;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.7);
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        /* --- Ausklappbare, vertikale Navigation links für Tablets & Smartphones --- */
        @media screen and (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                max-width: 100%;
                padding: 5px;
            }

            /* H1 bleibt oben, wird aber kompakter */
            .header-bar {
                padding: 6px 10px;
                gap: 2px;
            }

            .header-bar h1 {
                font-size: clamp(0.8rem, 3.8vw, 1.5rem); 
                white-space: nowrap;
                text-shadow: 2px 2px 0px #e50914, 3px 3px 6px rgba(0,0,0,0.9);
            }

            /* Verstecke die normale Navigation im Header auf Mobile */
            .header-bar .quick-nav {
                display: none;
            }

            /* Hamburger-Button auf Mobile einblenden */
            .nav-toggle {
                display: block;
            }

            /* Halbtransparenter Hintergrund hinter dem Drawer.
               Deckt IMMER den kompletten Bildschirm ab (0 bis 100vh),
               dadurch kein Überlappen/Reinragen in Header oder Footer mehr,
               egal wie hoch diese je nach Gerät gerade sind. */
            .nav-backdrop {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                /* WICHTIG: niedriger als der z-index von .header-bar (1000)!
                   Das Menü liegt im HTML verschachtelt innerhalb von
                   .header-bar, welches durch position:fixed + z-index einen
                   eigenen Stacking-Context bildet. Der z-index des Menüs
                   (weiter unten, 1500) wirkt deshalb NUR innerhalb dieses
                   Headers, nicht gegenüber diesem Backdrop hier. Wäre dieser
                   Wert höher als 1000, würde er den kompletten Header samt
                   Menü optisch überdecken und dessen Klicks abfangen -
                   sichtbar bliebe alles (halbtransparent), klickbar aber nicht. */
                z-index: 900;
            }

            .nav-backdrop.open {
                display: block;
            }

            /* Vollflächiges Drawer-Panel links, klar vom Content abgesetzt
               durch einen durchgehenden, blickdichten Hintergrund
               (kein durchscheinender roter Rand mehr) */
            .quick-nav.mobile-sidebar {
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 0;
                left: 0;
                width: min(58vw, 220px);
                height: 100vh;
                height: 100dvh;
                background-color: #161616;
                border-right: 1px solid var(--border-color);
                box-shadow: 4px 0 24px rgba(0,0,0,0.6);
                z-index: 1500;
                padding: 64px 12px 20px;
                gap: 6px;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                overflow-y: auto;
                box-sizing: border-box;
                align-items: stretch;
            }

            /* Wenn die Klasse 'open' aktiv ist, fährt das Panel ein */
            .quick-nav.mobile-sidebar.open {
                transform: translateX(0);
            }

            /* Schließen-Button oben im Drawer - nur hier sichtbar */
            .nav-close {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                top: 16px;
                right: 16px;
                width: 34px;
                height: 34px;
                background: rgba(255,255,255,0.05);
                border: 1px solid var(--border-color);
                border-radius: 6px;
                color: var(--text-color);
                font-size: 1.1rem;
                line-height: 1;
                cursor: pointer;
            }

            /* Normale, waagerechte Links im Drawer statt gedrehtem Text */
            .quick-nav.mobile-sidebar a {
                writing-mode: horizontal-tb;
                transform: none;
                font-size: 0.82rem;
                padding: 10px 12px;
                text-align: left;
                white-space: normal;
                background-color: rgba(255,255,255,0.03);
                border-radius: 6px;
                color: var(--text-muted);
                text-decoration: none;
                border: 1px solid var(--border-color);
                touch-action: manipulation;
                -webkit-tap-highlight-color: rgba(255,255,255,0.15);
            }

            .quick-nav.mobile-sidebar {
                touch-action: pan-y;
            }

            /* Zähler "(n/n)" nur im mobilen Drawer sichtbar - ergänzt die
               grüne Füllung um genaue Zahlen für einen besseren Überblick */
            .nav-progress {
                display: inline;
                font-size: 0.72rem;
                color: var(--text-muted);
                margin-left: 4px;
            }

            .quick-nav.mobile-sidebar a:active,
            .quick-nav.mobile-sidebar a:hover {
                color: #ffffff;
                background-color: var(--accent-color);
            }

            /* Abstandhalter oben dynamisch an die kleinere Header-Größe angepasst.
               padding-bottom analog zu Desktop, an kleineren Mobile-Footer
               angepasst (Bug #15) */
            .content-wrapper {
                margin-top: clamp(60px, 12vw, 85px);
                padding-bottom: 50px;
            }

            h2 {
                font-size: 1.3rem;
                /* Dynamischer Anker-Abstand, damit H2 perfekt unter dem Header sitzt */
                scroll-margin-top: clamp(65px, 14vw, 90px);
            }

            /* --- Poster-Bleed-Effekt (nur Mobile): Poster liegt als
               durchgehender Hintergrund HINTER der kompletten Karte (nicht
               mehr als eigene seitliche Box), object-position:top verhindert
               dass Köpfe/Gesichter beim Zuschneiden verloren gehen (Poster
               werden praktisch immer von UNTEN statt mittig beschnitten).
               Fade-Zone in festen Pixeln (nicht Prozent), damit sie bei
               unterschiedlich langen Beschreibungen (= unterschiedlich hohen
               Karten) immer an derselben Stelle sitzt statt mitzuwandern.
               Text-Schatten als zusätzliche Sicherheit für Lesbarkeit,
               unabhängig davon wie hell/unruhig ein Poster-Motiv ist. */
            .movie-card {
                position: relative;
                overflow: hidden;
                padding: 0;
                gap: 0;
                /* Desktop koppelt Kartenhöhe per aspect-ratio an die
                   Poster-Breite - auf Mobile richtet sich die Höhe dagegen
                   nach dem Inhalt, daher hier zurücksetzen. */
                aspect-ratio: auto;
            }

            .movie-poster {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: none;
                border-radius: 0;
                /* Desktop nutzt eine horizontale Mask für den seitlichen
                   Fade - auf Mobile übernimmt das der ::after-Verlauf
                   (vertikal), daher Mask hier deaktivieren. */
                -webkit-mask-image: none;
                mask-image: none;
            }

            .movie-poster::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(to bottom,
                    rgba(18, 18, 18, 0) 0px,
                    rgba(18, 18, 18, 0) 120px,
                    var(--card-bg) 185px,
                    var(--card-bg) 100%);
            }

            .movie-poster img {
                object-position: top;
            }

            /* Auf Mobile ist das Poster der Kartenhintergrund. Fehlt es, würde
               oben ein großer leerer Bereich stehen bleiben - deshalb hier
               Platzhalter-Symbol weglassen und den Textabstand zurücknehmen. */
            .movie-poster.poster-missing {
                background-color: transparent;
                border-right: none;
            }

            .movie-poster.poster-missing::before {
                content: none;
            }

            .movie-card.no-poster .movie-content {
                padding-top: 14px;
            }

            .movie-content {
                position: relative;
                z-index: 1;
                margin-left: 0;
                padding: 195px 14px 14px;
                /* Desktop-Rückwärtsverlauf und vertikale Zentrierung gelten
                   nur dort - auf Mobile liegt der Text unter dem Poster. */
                background: none;
                justify-content: flex-start;
            }

            .movie-title,
            .movie-desc,
            .movie-runtime {
                text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
            }

            .movie-title {
                font-size: 1rem;
            }

            .movie-desc {
                font-size: 0.8rem;
            }

            .popcorn {
                font-size: 1.1rem;
            }

            .movie-runtime {
                font-size: 0.75rem;
            }

            .meta-icon {
                height: 15px;
            }

            .movie-meta-row {
                gap: 6px;
            }

            .movie-meta-left {
                gap: 14px;
            }

            footer {
                font-size: 0.7rem;
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>
    <div id="top"></div>

    <!-- Fixierte Kopfzeile oben -->
    <header class="header-bar">
        <button class="nav-toggle" id="navToggle" onclick="toggleSidebar()" aria-label="Menü öffnen">
            <span></span><span></span><span></span>
        </button>
        <h1>Marvel - Cinematic Experience Fan Guide</h1>
        <nav class="quick-nav mobile-sidebar" id="mobileNav"></nav>
    </header>
    <div class="nav-backdrop" id="navBackdrop" onclick="toggleSidebar()"></div>

    <div class="container content-wrapper">
    </div>

    <!-- Fixierter Footer unten -->
    <footer>
        <p>(c) Marvel - Cinematic Experience  Fan Guide by .Kriz - 2026</p>
    </footer>

    <!-- Overlay-Container -->
    <div id="poster-overlay" onclick="closeOverlay()">
        <img id="overlay-img" src="" alt="Großes Poster">
    </div>

    <script>
        // ================================================================
        // FILM-DATENBANK
        // Neue Filme hinzufügen, Reihenfolge ändern oder Sektionen anpassen:
        // Einfach hier im Array editieren - der Rest rendert sich automatisch.
        // Jede Sektion braucht: id (für Anker-Links, ohne Leerzeichen),
        // title (Überschrift im Text), navLabel (Kurzform fürs Menü)
        // und movies[] mit title, poster (Bild-URL) und desc.
        // ================================================================
        // Filmdaten werden zur Laufzeit aus moviedata.json geladen (siehe unten fetchAndRender()).
        let MOVIE_DATA = [];

        // Escaped Sonderzeichen, damit Titel/Beschreibungen nie HTML brechen
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderNav() {
            const nav = document.getElementById('mobileNav');
            const closeButton = `<button class="nav-close" aria-label="Menü schließen">✕</button>`;
            const homeLink = `<a href="#top" class="nav-home" data-fill-key="nav-home" aria-label="Zur Startseite"><span class="nav-home-icon">🏠</span> Home <span class="nav-progress" data-progress-key="nav-home"></span></a>`;
            const links = MOVIE_DATA.map((section, i) =>
                `<a href="#${section.id}" data-section-id="${section.id}" data-fill-key="${section.id}">${i + 1}. ${escapeHtml(section.navLabel)} <span class="nav-progress" data-progress-key="${section.id}"></span></a>`
            ).join('');
            nav.innerHTML = closeButton + homeLink + links;

            // Klick-Handler per addEventListener statt Inline-onclick binden.
            // Robuster als String-Interpolation in onclick-Attributen, da so
            // keine Sonderzeichen (Anführungszeichen o.ä.) in IDs die
            // generierten Attribute versehentlich zerstören können.
            nav.querySelector('.nav-close').addEventListener('click', toggleSidebar);
            nav.querySelector('.nav-home').addEventListener('click', goHome);
            nav.querySelectorAll('a[data-section-id]').forEach(link => {
                link.addEventListener('click', event => goToSection(event, link.dataset.sectionId));
            });
        }

        // Scrollt sanft nach ganz oben und schließt dabei das mobile Drawer-Menü
        function goHome(event) {
            event.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            closeSidebar();
        }

        // Scrollt gezielt zu einer Sektion. Wird per JS statt per nativem
        // Anker-Sprung erledigt, da der native Sprung in manchen mobilen
        // Browsern nicht zuverlässig funktioniert, wenn der Link in einem
        // Container mit CSS-"transform" liegt (unser Slide-in-Menü).
        function goToSection(event, sectionId) {
            event.preventDefault();
            const target = document.getElementById(sectionId);
            closeSidebar();
            if (target) {
                // kurze Verzögerung, damit die Schließen-Animation des Menüs
                // den Scrollvorgang nicht stört
                setTimeout(() => {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 60);
            } else {
                console.warn('Ziel-Sektion nicht gefunden:', sectionId);
            }
        }

        // --- Bewertungssystem (0-5 Popcorn-Tüten), NUR lokal im Browser gespeichert ---
        // Nutzt localStorage - die Bewertung bleibt auf diesem Gerät/Browser und
        // wird nirgendwo hochgeladen oder synchronisiert.
        // --- "Gesehen"-Status (Issue #3), NUR lokal im Browser gespeichert ---
        // Unabhängig von der Popcorn-Bewertung: reines Ja/Nein pro Film.
        // Setzt den Hintergrund eines Nav-Buttons als Fortschritts-Füllung:
        // links "pct" Prozent grün (gesehen), rest transparent/normal.
        function applyNavFill(fillKey, pct) {
            document.querySelectorAll('.quick-nav a[data-fill-key="' + fillKey + '"]').forEach(link => {
                link.style.background =
                    `linear-gradient(to right, rgba(76, 175, 80, 0.45) ${pct}%, rgba(255, 255, 255, 0.05) ${pct}%)`;
            });
        }

        // Setzt den "(n/n)"-Text im Nav-Button (nur auf Mobile sichtbar,
        // siehe .nav-progress CSS) - ergänzt die Füllung um genaue Zahlen.
        function applyNavProgressText(progressKey, watched, total) {
            document.querySelectorAll('.nav-progress[data-progress-key="' + progressKey + '"]').forEach(el => {
                el.textContent = `(${watched}/${total})`;
            });
        }

        // Ein Film gilt als "gesehen", sobald er bewertet wurde (Rating > 0).
        // Bewusst kein eigener, separater Gesehen-Status mehr - eine Bewertung
        // impliziert ja bereits, dass der Film geschaut wurde.
        function updateProgress() {
            let total = 0;
            let watchedTotal = 0;

            MOVIE_DATA.forEach(section => {
                let sectionTotal = 0;
                let sectionWatched = 0;
                section.movies.forEach(movie => {
                    sectionTotal++;
                    total++;
                    if (getRating(movie.id) > 0) {
                        sectionWatched++;
                        watchedTotal++;
                    }
                });
                const counter = document.querySelector('.section-count[data-section-id="' + section.id + '"]');
                if (counter) counter.textContent = `(${sectionWatched}/${sectionTotal})`;

                const sectionPct = sectionTotal > 0 ? (sectionWatched / sectionTotal * 100) : 0;
                applyNavFill(section.id, sectionPct);
                applyNavProgressText(section.id, sectionWatched, sectionTotal);
            });

            const overallPct = total > 0 ? (watchedTotal / total * 100) : 0;
            applyNavFill('nav-home', overallPct);
            applyNavProgressText('nav-home', watchedTotal, total);
        }

        function ratingKey(movieId) {
            return 'mcu-rating-' + movieId;
        }

        function getRating(movieId) {
            try {
                return parseInt(localStorage.getItem(ratingKey(movieId)) || '0', 10);
            } catch (e) {
                return 0; // z.B. privates Surfen ohne Storage-Zugriff
            }
        }

        function setRating(movieId, value, event) {
            event.stopPropagation(); // verhindert, dass die Karte das Poster-Overlay öffnet
            const current = getRating(movieId);
            const next = (current === value) ? 0 : value; // erneutes Antippen setzt zurück
            try {
                localStorage.setItem(ratingKey(movieId), String(next));
            } catch (e) {
                console.warn('Bewertung konnte nicht gespeichert werden:', e);
            }
            updateRatingDisplay(movieId);
            updateProgress(); // Bewertung > 0 zählt als "gesehen" -> Fortschritt neu berechnen

            const card = document.querySelector('.movie-card[data-movie-id="' + movieId + '"]');
            if (card) card.classList.toggle('watched', next > 0);
        }

        function updateRatingDisplay(movieId) {
            const widget = document.querySelector('.movie-rating[data-movie-id="' + movieId + '"]');
            if (!widget) return;
            const current = getRating(movieId);
            widget.querySelectorAll('.popcorn').forEach(el => {
                const val = parseInt(el.dataset.value, 10);
                el.classList.toggle('filled', val <= current);
            });
        }

        function renderRatingWidget(movieId) {
            const current = getRating(movieId);
            const bags = [1, 2, 3, 4, 5].map(i => {
                const filled = i <= current ? ' filled' : '';
                return `<span class="popcorn${filled}" data-value="${i}" onclick="setRating('${movieId}', ${i}, event)" role="button" aria-label="${i} von 5 Popcorn-Tüten bewerten">🍿</span>`;
            }).join('');
            return `<div class="movie-rating" data-movie-id="${movieId}">${bags}</div>`;
        }

        function renderMovieRuntime(movie) {
            return movie.runtime
                ? `<span class="movie-runtime"><span class="runtime-icon" aria-hidden="true">🎞️</span>${escapeHtml(movie.runtime)}</span>`
                : '';
        }

        function renderMovieMeta(movie) {
            const imdbLink = movie.imdb
                ? `<a href="${escapeHtml(movie.imdb)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" aria-label="${escapeHtml(movie.title)} auf IMDb ansehen"><img class="meta-icon" src="imdb.png" alt="IMDb" loading="lazy"></a>`
                : '';
            const tmdbLink = movie.tmdb
                ? `<a href="${escapeHtml(movie.tmdb)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" aria-label="${escapeHtml(movie.title)} auf TMDb ansehen"><img class="meta-icon" src="tmdb.png" alt="TMDb" loading="lazy"></a>`
                : '';
            return `<div class="movie-meta-left">${imdbLink}${tmdbLink}</div>`;
        }

        function renderMovieCard(movie) {
            const watchedClass = getRating(movie.id) > 0 ? ' watched' : '';
            return `
        <div class="movie-card${watchedClass}" data-movie-id="${movie.id}" onclick="openOverlay(this)">
            <div class="movie-poster">
                <img src="${movie.poster}" alt="${escapeHtml(movie.title)}" loading="lazy" onerror="handlePosterError(this)">
            </div>
            <div class="movie-content">
                <div class="movie-title-row">
                    <div class="movie-title">${escapeHtml(movie.title)}</div>
                    ${renderMovieRuntime(movie)}
                </div>
                <div class="movie-desc">${escapeHtml(movie.desc)}</div>
                <div class="movie-meta-row">
                    ${renderMovieMeta(movie)}
                    ${renderRatingWidget(movie.id)}
                </div>
            </div>
        </div>`;
        }

        function renderContent() {
            const container = document.querySelector('.container.content-wrapper');
            const sectionsHtml = MOVIE_DATA.map(section => `
        <h2 id="${section.id}">${escapeHtml(section.title)} <span class="section-count" data-section-id="${section.id}"></span></h2>
        ${section.movies.map(renderMovieCard).join('')}
            `).join('');
            container.innerHTML = sectionsHtml;
            updateProgress();
        }

        // Lädt moviedata.json und rendert erst danach Navigation und Filmkarten.
        // Hinweis: fetch() auf eine lokale Datei funktioniert nur über http(s) -
        // z. B. auf GitHub Pages, oder lokal über einen einfachen Webserver
        // (python3 -m http.server), NICHT per Doppelklick/file://.
        // Prüft die geladenen Daten Eintrag für Eintrag. Fehlerhafte Sektionen
        // oder Filme werden übersprungen statt die komplette Seite lahmzulegen -
        // ein vergessenes Komma bei einem Film soll nicht die anderen 46 kosten.
        // Gibt {sections, skippedSections, skippedMovies} zurück.
        function validateMovieData(raw) {
            const result = { sections: [], skippedSections: 0, skippedMovies: 0 };

            if (!Array.isArray(raw)) {
                console.error('moviedata.json enthält kein Array auf oberster Ebene.');
                return result;
            }

            raw.forEach((section, sIdx) => {
                if (!section || typeof section !== 'object') {
                    console.warn(`Sektion ${sIdx + 1} übersprungen: kein gültiges Objekt.`);
                    result.skippedSections++;
                    return;
                }
                if (!section.id || !section.title) {
                    console.warn(`Sektion ${sIdx + 1} übersprungen: "id" oder "title" fehlt.`, section);
                    result.skippedSections++;
                    return;
                }
                if (!Array.isArray(section.movies)) {
                    console.warn(`Sektion "${section.title}" übersprungen: "movies" ist kein Array.`);
                    result.skippedSections++;
                    return;
                }

                const validMovies = [];
                section.movies.forEach((movie, mIdx) => {
                    if (!movie || typeof movie !== 'object') {
                        console.warn(`Film ${mIdx + 1} in "${section.title}" übersprungen: kein gültiges Objekt.`);
                        result.skippedMovies++;
                        return;
                    }
                    if (!movie.id || !movie.title) {
                        console.warn(`Film ${mIdx + 1} in "${section.title}" übersprungen: "id" oder "title" fehlt.`, movie);
                        result.skippedMovies++;
                        return;
                    }
                    // Fehlende optionale Felder sind kein Grund zum Überspringen -
                    // lieber den Film mit Lücke zeigen als gar nicht.
                    validMovies.push({
                        ...movie,
                        desc: movie.desc || '',
                        poster: movie.poster || '',
                        runtime: movie.runtime || ''
                    });
                });

                result.sections.push({
                    ...section,
                    navLabel: section.navLabel || section.title,
                    movies: validMovies
                });
            });

            return result;
        }

        // Springt ein Posterbild nicht an (Datei fehlt, falscher Pfad, offline),
        // wird statt des kaputten Bild-Symbols ein Platzhalter angezeigt.
        function handlePosterError(imgElement) {
            const poster = imgElement.closest('.movie-poster');
            const card = imgElement.closest('.movie-card');
            imgElement.remove();
            if (poster) poster.classList.add('poster-missing');
            if (card) card.classList.add('no-poster');
            console.warn('Poster konnte nicht geladen werden:', imgElement.getAttribute('src'));
        }

        async function fetchAndRender() {
            const container = document.querySelector('.container.content-wrapper');
            try {
                const response = await fetch('moviedata.json');
                if (!response.ok) throw new Error('HTTP ' + response.status);

                let raw;
                try {
                    raw = await response.json();
                } catch (parseErr) {
                    // JSON-Syntaxfehler getrennt behandeln - andere Ursache,
                    // andere Lösung als ein fehlgeschlagener Download.
                    throw new Error('INVALID_JSON');
                }

                const { sections, skippedSections, skippedMovies } = validateMovieData(raw);

                if (sections.length === 0) {
                    throw new Error('NO_VALID_DATA');
                }

                MOVIE_DATA = sections;
                renderNav();
                renderContent();

                if (skippedSections > 0 || skippedMovies > 0) {
                    console.warn(
                        `Hinweis: ${skippedSections} Sektion(en) und ${skippedMovies} Film(e) ` +
                        'wurden wegen fehlerhafter Daten übersprungen. Details siehe Meldungen oben.'
                    );
                }
            } catch (err) {
                console.error('Konnte Filmdaten nicht laden:', err);
                container.innerHTML = buildErrorMessage(err);
            }
        }

        function buildErrorMessage(err) {
            const wrap = (text) =>
                '<p style="text-align:center; padding: 40px 16px; line-height: 1.7;">' + text + '</p>';

            if (!navigator.onLine) {
                return wrap(
                    'Keine Internetverbindung. Die Filmdaten konnten nicht geladen werden - ' +
                    'bitte Verbindung prüfen und die Seite neu laden.'
                );
            }
            if (err && err.message === 'INVALID_JSON') {
                return wrap(
                    '<code>moviedata.json</code> konnte nicht gelesen werden - die Datei ist ' +
                    'vermutlich fehlerhaft (z.&nbsp;B. ein fehlendes oder überzähliges Komma). ' +
                    'Details stehen in der Browser-Konsole.'
                );
            }
            if (err && err.message === 'NO_VALID_DATA') {
                return wrap(
                    'Die Filmdaten enthalten keine gültigen Einträge. ' +
                    'Details stehen in der Browser-Konsole.'
                );
            }
            return wrap(
                'Filmdaten konnten nicht geladen werden. Läuft die Seite über ' +
                'http(s) (z.&nbsp;B. GitHub Pages oder einen lokalen Webserver) und ' +
                'liegt <code>moviedata.json</code> im selben Ordner wie diese Datei?'
            );
        }

        fetchAndRender();
    </script>

    <script>
        function openOverlay(cardElement) {
            const imgElement = cardElement.querySelector('.movie-poster img');
            if (!imgElement) return;
            
            const overlay = document.getElementById('poster-overlay');
            const overlayImg = document.getElementById('overlay-img');
            overlayImg.src = imgElement.src;
            overlay.style.display = 'flex';
        }

        function closeOverlay() {
            const overlay = document.getElementById('poster-overlay');
            overlay.style.display = 'none';
        }

        // ESC schließt Poster-Overlay bzw. Navigations-Drawer
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeOverlay();
                closeSidebar();
            }
        });

        // Funktion zum Ein- und Ausklappen des Navigations-Drawers auf Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('mobileNav');
            const backdrop = document.getElementById('navBackdrop');
            const toggleBtn = document.getElementById('navToggle');
            const isOpen = sidebar.classList.toggle('open');
            backdrop.classList.toggle('open', isOpen);
            toggleBtn.classList.toggle('open', isOpen);
            toggleBtn.setAttribute('aria-label', isOpen ? 'Menü schließen' : 'Menü öffnen');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('mobileNav');
            if (sidebar.classList.contains('open')) {
                toggleSidebar();
            }
        }

        // Touch-Gestenerkennung für Wischfunktion (Swipe)
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const sidebar = document.getElementById('mobileNav');
            const swipeDistance = touchEndX - touchStartX;
            
            // Wenn nach rechts gewischt wird (und Wischstrecke > 70px war) -> Menü öffnen
            if (swipeDistance > 70 && !sidebar.classList.contains('open')) {
                toggleSidebar();
            }
            // Wenn nach links gewischt wird (und Wischstrecke < -70px war) -> Menü schließen
            else if (swipeDistance < -70 && sidebar.classList.contains('open')) {
                toggleSidebar();
            }
        }
    </script>

</body>
